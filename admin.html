<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Titanware · Panel de administración</title>
<meta name="theme-color" content="#050509">
<link rel="icon" type="image/png" href="img/logo/favicon.png">
<link rel="apple-touch-icon" href="img/logo/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root { --header-h: 64px; }
  .adm-head { position: sticky; top: 0; z-index: 20; background: rgba(5, 5, 9, .92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  .adm-head .wrap { height: 64px; display: flex; align-items: center; gap: 1rem; }
  .adm-head .brand small { font-family: var(--body); font-size: .72rem; font-weight: 600; letter-spacing: .1em; color: var(--violet-soft); text-transform: uppercase; margin-left: .25rem; }
  .adm-head .right { margin-left: auto; display: flex; align-items: center; gap: .6rem; }
  .pill { display: inline-flex; align-items: center; gap: .4rem; font-size: .78rem; padding: .3rem .7rem; border-radius: 999px; border: 1px solid var(--line-2); color: var(--muted); white-space: nowrap; }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .pill.on i { background: var(--ok); box-shadow: 0 0 0 3px rgba(79, 201, 142, .18); }
  .pill.on { color: var(--text-2); }
  .pill.off i { background: var(--warn); }
  .adm-main { padding-block: 1.5rem 5rem; }
  .adm-tabs { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: 1.25rem; border-bottom: 1px solid var(--line); }
  .adm-tabs button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: .7rem .9rem; cursor: pointer; font-weight: 600; font-size: .9rem; margin-bottom: -1px; }
  .adm-tabs button:hover { color: var(--text); }
  .adm-tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--violet); }
  .adm-tabs button b { font-weight: 600; color: var(--violet-soft); font-size: .78rem; margin-left: .3rem; }
  .panel-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.4rem; }
  .panel-card h2 { margin: 0 0 .4rem; font-size: 1.2rem; }
  .panel-card p { color: var(--text-2); margin: 0 0 .8rem; font-size: .92rem; }
  .connect { max-width: 760px; margin: 1rem auto 3rem; }
  .connect ol { color: var(--text-2); font-size: .9rem; padding-left: 1.2rem; line-height: 1.7; margin: .3rem 0 1rem; }
  .connect code, .hint code { background: var(--bg-2); border: 1px solid var(--line); border-radius: 5px; padding: .05rem .35rem; font-size: .85em; }
  .form-grid { display: grid; gap: .8rem; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .form-grid .full { grid-column: 1 / -1; }
  .fld { display: grid; gap: .3rem; font-size: .8rem; color: var(--muted); font-weight: 600; }
  .fld input, .fld select, .fld textarea, .inp {
    width: 100%; background: var(--bg-2); border: 1px solid var(--line-2); border-radius: var(--radius-sm); color: var(--text);
    padding: .55rem .7rem; font: inherit; font-size: .9rem; font-weight: 400;
  }
  .fld textarea { min-height: 80px; resize: vertical; }
  .fld input:focus, .fld select:focus, .fld textarea:focus, .inp:focus { outline: none; border-color: var(--violet); }
  .fld .hint, .hint { font-weight: 400; font-size: .75rem; color: var(--muted); }
  .check { display: inline-flex; align-items: center; gap: .5rem; font-size: .88rem; color: var(--text-2); cursor: pointer; }
  .check input { accent-color: var(--violet); width: 16px; height: 16px; }
  .row-actions { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-top: 1rem; }
  .bar { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; margin-bottom: 1rem; }
  .bar .hsearch { margin: 0; max-width: 360px; border-radius: var(--radius-sm); }
  .bar .grow { flex: 1; }
  .tbl-wrap { overflow: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  table.tbl { width: 100%; border-collapse: collapse; font-size: .86rem; }
  .tbl th { position: sticky; top: 0; background: var(--bg-2); text-align: left; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: .6rem .7rem; border-bottom: 1px solid var(--line); white-space: nowrap; z-index: 1; }
  .tbl td { padding: .5rem .7rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .tbl tr:last-child td { border-bottom: 0; }
  .tbl tr:hover td { background: rgba(255, 255, 255, .015); }
  .tbl .name strong { display: block; font-weight: 600; color: var(--text); }
  .tbl .name small { color: var(--muted); font-size: .72rem; }
  .tbl .price-in { width: 120px; padding: .4rem .55rem; font-variant-numeric: tabular-nums; }
  .tbl .stock-in { width: 125px; padding: .4rem .5rem; }
  .tbl td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tbl .acts { display: flex; gap: .25rem; justify-content: flex-end; }
  .tbl .mini { width: 52px; height: 38px; }
  .tbl tr.changed td:first-child { box-shadow: inset 3px 0 0 var(--violet); }
  .ibtn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--line-2); background: var(--bg-2); color: var(--text-2); cursor: pointer; }
  .ibtn:hover { color: var(--text); border-color: var(--violet); }
  .ibtn.danger:hover { color: var(--off); border-color: var(--off); }
  .ibtn svg { width: 15px; height: 15px; }
  .tag { display: inline-block; font-size: .7rem; font-weight: 600; padding: .1rem .45rem; border-radius: 999px; background: var(--violet-tint); color: var(--violet-soft); }
  .tag.warn { background: rgba(226, 176, 79, .12); color: var(--warn); }
  .tag.err { background: rgba(224, 113, 127, .12); color: var(--off); }
  .tag.ok { background: rgba(79, 201, 142, .12); color: var(--ok); }
  .up { color: var(--off); } .down { color: var(--ok); }
  dialog.adm-dlg { width: min(860px, 100% - 2rem); }
  dialog.adm-dlg .dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 2; }
  dialog.adm-dlg .dlg-head h2 { margin: 0; font-size: 1.1rem; }
  dialog.adm-dlg .dlg-head .close { position: static; }
  dialog.adm-dlg .dlg-body { padding: 1.25rem; display: grid; gap: 1rem; }
  dialog.adm-dlg .dlg-foot { display: flex; justify-content: flex-end; gap: .5rem; padding: 1rem 1.25rem; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--surface); }
  .detect { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: .8rem 1rem; font-size: .85rem; color: var(--text-2); display: grid; gap: .5rem; }
  .detect .chips { display: flex; flex-wrap: wrap; gap: .35rem; }
  .img-box { display: flex; gap: .8rem; align-items: center; }
  .img-box .mini { width: 96px; height: 72px; }
  .slots { display: grid; gap: .6rem; }
  .slot { display: grid; grid-template-columns: 140px minmax(0, 1fr) 80px; gap: .6rem; align-items: center; }
  .slot label { font-size: .8rem; font-weight: 600; color: var(--muted); }
  .slot .inp { padding: .45rem .6rem; }
  .pc-quick { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; padding: .85rem 1rem; border-radius: var(--radius-sm); background: var(--violet-tint); border: 1px solid rgba(138, 0, 255, .4); }
  .pc-quick > div { display: grid; gap: .15rem; font-size: .9rem; }
  .slots2 { display: grid; gap: .4rem; }
  .slot2 { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: .5rem; align-items: center; }
  .slot-row { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: .75rem; align-items: center; width: 100%; text-align: left; cursor: pointer;
    padding: .45rem .75rem .45rem .45rem; border-radius: var(--radius-sm); border: 1px dashed var(--line-2); background: var(--bg-2); color: var(--text); font: inherit; }
  .slot-row:hover { border-color: var(--violet); }
  .slot2.done .slot-row { border-style: solid; }
  .slot2.open .slot-row { border-color: var(--violet); border-style: solid; }
  .slot-row .mini { width: 48px; height: 38px; color: var(--muted); }
  .slot-row .mini > svg { width: 60%; }
  .slot-txt { display: grid; min-width: 0; font-size: .88rem; }
  .slot-txt small { font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .slot-txt em { color: var(--violet-soft); font-style: normal; }
  .slot-row b { font-size: .85rem; white-space: nowrap; }
  .slot-qty { display: flex; align-items: center; gap: .3rem; font-size: .75rem; color: var(--muted); }
  .slot-qty .inp { width: 58px; padding: .4rem .5rem; }
  .picker { grid-column: 1 / -1; border: 1px solid var(--violet); border-radius: var(--radius-sm); background: var(--surface); overflow: hidden; }
  .picker-bar { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; padding: .6rem; border-bottom: 1px solid var(--line); }
  .picker-bar .inp { flex: 1; min-width: 180px; }
  .picker-list { max-height: 300px; overflow: auto; }
  .pick-it { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: .7rem; align-items: center; width: 100%; padding: .45rem .75rem; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--text); text-align: left; font: inherit; font-size: .86rem; cursor: pointer; }
  .pick-it:hover { background: var(--violet-tint); }
  .pick-it.sel { background: var(--violet-tint); box-shadow: inset 3px 0 0 var(--violet); }
  .pick-it .mini { width: 44px; height: 34px; }
  .pick-it small.warn { display: block; color: var(--warn); font-size: .72rem; }
  .pick-it b { font-size: .82rem; white-space: nowrap; }
  details.more summary { cursor: pointer; font-size: .88rem; font-weight: 600; color: var(--text-2); }
  .tbl .offer-in.on { border-color: #ff3d6e; color: #ff9aac; }
  .issues { display: grid; gap: .3rem; font-size: .83rem; }
  .issues .error { color: var(--off); } .issues .aviso { color: var(--warn); } .issues .falta { color: var(--muted); } .issues .ok { color: var(--ok); }
  .pc-rows { display: grid; gap: .6rem; }
  .pc-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 1rem; align-items: center; padding: .9rem 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  .pc-row h3 { margin: 0; font-size: 1rem; }
  .pc-row .sub { color: var(--muted); font-size: .8rem; margin-top: .15rem; display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
  .imp-sec { margin-top: 1.25rem; }
  .imp-sec h3 { margin: 0 0 .5rem; font-size: 1rem; display: flex; align-items: center; gap: .5rem; }
  .publish-bar { position: fixed; left: 50%; bottom: 1.25rem; transform: translateX(-50%); z-index: 30; display: flex; align-items: center; gap: 1rem; padding: .6rem .6rem .6rem 1.1rem; border-radius: 999px; background: var(--surface-2); border: 1px solid rgba(138, 0, 255, .5); box-shadow: var(--shadow-lg); font-size: .88rem; }
  .publish-bar[hidden] { display: none; }
  .empty-mini { padding: 2rem; text-align: center; color: var(--muted); border: 1px dashed var(--line-2); border-radius: var(--radius); }
  @media (max-width: 760px) {
    .form-grid { grid-template-columns: 1fr; }
    .slot { grid-template-columns: 1fr 70px; }
    .slot label { grid-column: 1 / -1; }
    .pc-row { grid-template-columns: 1fr; }
    .adm-head .pill { display: none; }
    .publish-bar { left: 1rem; right: 1rem; transform: none; border-radius: var(--radius); }
  }
</style>
</head>
<body>

<header class="adm-head">
  <div class="wrap">
    <a class="brand" href="admin.html" aria-label="Panel Titanware">
      <img class="brand-emblem" src="img/logo/emblema.png" alt="" width="65" height="34">
      <img class="brand-word" src="img/logo/wordmark.png" alt="Titanware" width="170" height="18"><small>Panel</small>
    </a>
    <div class="right">
      <span class="pill" id="connPill"><i></i><span>Sin conectar</span></span>
      <a class="btn sm ghost" href="index.html" target="_blank" rel="noopener">Ver tienda</a>
      <button class="btn sm" id="publishBtn" type="button" disabled>Publicar cambios</button>
    </div>
  </div>
</header>

<main class="wrap adm-main" id="app">
  <div class="empty-mini">Cargando…</div>
</main>

<div class="publish-bar" id="publishBar" hidden>
  <span id="publishMsg">Tenés cambios sin publicar</span>
  <button class="btn sm" type="button" data-publish>Publicar ahora</button>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-wa" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z"/></symbol>
</svg>

<dialog id="dlg" class="adm-dlg"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/js/config.js?v=20260928"></script>

</body>
